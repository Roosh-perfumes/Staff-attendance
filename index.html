
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Staff Attendance</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{box-sizing:border-box}
body{
 font-family:Arial,sans-serif;
 background:#f3f5f9;
 margin:0;padding:16px;text-align:center
}
.card{
 background:white;max-width:480px;
 margin:15px auto;padding:22px 16px;
 border-radius:18px;
 box-shadow:0 4px 20px #00000012
}
h1{font-size:27px}
#date{font-size:18px;margin-top:20px}
#clock{font-size:31px;font-weight:bold;margin:10px}
.small{font-size:13px;color:#666}
button{
 width:100%;padding:16px;margin:7px 0;
 border:0;border-radius:10px;
 color:white;font-size:18px
}
.blue{background:#2458a6}
.green{background:#18794e}
.red{background:#b42318}
video{
 display:none;width:100%;
 border-radius:12px;margin:12px 0;
 transform:scaleX(-1)
}
#mapSection{display:none;margin-top:18px}
#map{
 height:350px;width:100%;
 border-radius:12px;background:#ddd
}
#status{
 margin:18px 0;padding:12px;
 border-radius:10px;background:#f1f3f5;
 line-height:1.6;overflow-wrap:anywhere
}
#distance{font-size:17px;font-weight:bold}
.legend{font-size:13px;margin:9px 0}
</style>
</head>

<body>
<div class="card">
<h1>Staff Attendance</h1>
<p>GPS Attendance System</p>

<div id="date"></div>
<div id="clock"></div>
<p class="small">UAE Time (GMT+4)</p>

<button class="blue" onclick="testCamera()">
Test Front Camera
</button>

<video id="video" autoplay playsinline muted></video>

<p class="small">Allowed Radius: 150 meters</p>

<button class="green" onclick="attendance('IN')">
Check In
</button>

<button class="red" onclick="attendance('OUT')">
Check Out
</button>

<div id="status">Ready for testing</div>

<section id="mapSection">
<h3>Satellite Location Map</h3>
<div id="map"></div>
<p class="legend">
🟢 Workplace &nbsp; 🔵 Your Location
</p>
<p id="distance"></p>
<p class="small">
Straight-line distance, not driving distance.
</p>
</section>

<p class="small">
TEST MODE — Attendance is not saved.
</p>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
"use strict";

// Provisional workplace location.
// Verify these coordinates before real use.
const WORKPLACE={
 lat:25.069191,
 lon:55.307863
};

const RADIUS=150;
const MAX_ACCURACY=75;

const statusBox=document.getElementById("status");
const video=document.getElementById("video");

let cameraStream=null;
let map=null;
let mapLayers=[];
let busy=false;

function updateClock(){
 const now=new Date();

 document.getElementById("date").textContent=
 new Intl.DateTimeFormat("en-GB",{
  timeZone:"Asia/Dubai",
  weekday:"long",
  day:"2-digit",
  month:"long",
  year:"numeric"
 }).format(now);

 document.getElementById("clock").textContent=
 new Intl.DateTimeFormat("en-GB",{
  timeZone:"Asia/Dubai",
  hour:"2-digit",
  minute:"2-digit",
  second:"2-digit",
  hour12:true
 }).format(now);
}
updateClock();
setInterval(updateClock,1000);

async function startCamera(){
 if(!navigator.mediaDevices?.getUserMedia){
  throw new Error("Camera not supported");
 }

 if(cameraStream){
  cameraStream.getTracks().forEach(t=>t.stop());
 }

 cameraStream=await navigator.mediaDevices.getUserMedia({
  audio:false,
  video:{facingMode:"user"}
 });

 video.srcObject=cameraStream;
 video.style.display="block";
 await video.play();
}

async function testCamera(){
 try{
  await startCamera();
  statusBox.textContent="Front camera is working.";
 }catch(e){
  statusBox.textContent="Camera error: "+e.message;
 }
}

function getGPS(){
 return new Promise((resolve,reject)=>{
  if(!navigator.geolocation){
   reject(new Error("GPS not supported"));
   return;
  }

  navigator.geolocation.getCurrentPosition(
   resolve,reject,{
    enableHighAccuracy:true,
    timeout:20000,
    maximumAge:0
   }
  );
 });
}

function distanceMeters(a,b){
 const rad=x=>x*Math.PI/180;
 const dLat=rad(b.lat-a.lat);
 const dLon=rad(b.lon-a.lon);

 const h=
 Math.sin(dLat/2)**2+
 Math.cos(rad(a.lat))*
 Math.cos(rad(b.lat))*
 Math.sin(dLon/2)**2;

 return 6371000*2*
 Math.atan2(Math.sqrt(h),Math.sqrt(1-h));
}

function formatDistance(m){
 return m>=1000
  ?(m/1000).toFixed(2)+" km"
  :Math.round(m)+" m";
}

function showMap(current,distance){
 document.getElementById("mapSection").style.display="block";

 document.getElementById("distance").textContent=
 "Distance from workplace: "+formatDistance(distance);

 if(typeof L==="undefined"){
  throw new Error("Map library did not load");
 }

 const workplacePoint=[WORKPLACE.lat,WORKPLACE.lon];
 const employeePoint=[current.lat,current.lon];

 if(!map){
  // Set the map view BEFORE adding any circles.
  map=L.map("map").setView(workplacePoint,15);

  L.tileLayer(
   "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
   {
    attribution:"Imagery © Esri and contributors",
    maxZoom:19
   }
  ).addTo(map);
 }

 mapLayers.forEach(layer=>map.removeLayer(layer));
 mapLayers=[];

 const workplaceMarker=L.circleMarker(
  workplacePoint,{
   radius:9,color:"white",weight:2,
   fillColor:"green",fillOpacity:1
  }
 ).addTo(map).bindPopup("Workplace");

 const employeeMarker=L.circleMarker(
  employeePoint,{
   radius:9,color:"white",weight:2,
   fillColor:"blue",fillOpacity:1
  }
 ).addTo(map).bindPopup("Your GPS Location");

 const allowedCircle=L.circle(
  workplacePoint,{
   radius:RADIUS,
   color:"green",
   weight:2,
   fillColor:"green",
   fillOpacity:0.13
  }
 ).addTo(map);

 const connection=L.polyline(
  [workplacePoint,employeePoint],
  {
   color:"#ffcc00",
   weight:3,
   dashArray:"7,7"
  }
 ).addTo(map);

 mapLayers.push(
  workplaceMarker,
  employeeMarker,
  allowedCircle,
  connection
 );

 const bounds=L.latLngBounds(
  workplacePoint,employeePoint
 );
 bounds.extend(allowedCircle.getBounds());

 setTimeout(()=>{
  map.invalidateSize();
  map.fitBounds(bounds.pad(0.3),{
   maxZoom:18,
   animate:false
  });
 },200);
}

async function attendance(type){
 if(busy)return;
 busy=true;

 document.getElementById("mapSection").style.display="none";
 statusBox.textContent="Opening front camera...";

 try{
  await startCamera();
 }catch(e){
  statusBox.textContent=
   "Camera unavailable: "+e.message+
   ". Test stopped.";
  busy=false;
  return;
 }

 statusBox.textContent="Checking GPS location...";

 let position;
 try{
  position=await getGPS();
 }catch(e){
  statusBox.textContent="GPS error: "+e.message;
  busy=false;
  return;
 }

 const current={
  lat:position.coords.latitude,
  lon:position.coords.longitude
 };

 const accuracy=position.coords.accuracy;
 const distance=distanceMeters(WORKPLACE,current);

 if(accuracy>MAX_ACCURACY){
  statusBox.textContent=
   type+" NOT ALLOWED — GPS accuracy too low ("+
   Math.round(accuracy)+"m).";
 }else if(distance+accuracy<=RADIUS){
  statusBox.textContent=
   type+" TEST ALLOWED. Distance: "+
   formatDistance(distance)+
   ". Accuracy: "+Math.round(accuracy)+"m.";
 }else if(distance-accuracy>RADIUS){
  statusBox.textContent=
   type+" REJECTED — OUTSIDE WORKPLACE. "+
   "Distance: "+formatDistance(distance)+
   ". Accuracy: "+Math.round(accuracy)+"m.";
 }else{
  statusBox.textContent=
   type+" NOT ALLOWED — GPS boundary uncertain. "+
   "Distance: "+formatDistance(distance)+
   ". Accuracy: "+Math.round(accuracy)+"m.";
 }

 try{
  showMap(current,distance);
 }catch(e){
  statusBox.textContent+=
   " Map error: "+e.message;
 }

 busy=false;
}
</script>
</body>
</html>
