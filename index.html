
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Staff Attendance</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: Arial, sans-serif;
    background: #f3f5f9;
    margin: 0;
    padding: 24px;
    text-align: center;
  }
  .card {
    background: white;
    max-width: 450px;
    margin: 50px auto;
    padding: 28px 22px;
    border-radius: 18px;
    box-shadow: 0 4px 20px #00000012;
  }
  h1 { font-size: 28px; }
  #date {
    font-size: 19px;
    margin-top: 25px;
  }
  #clock {
    font-size: 32px;
    font-weight: bold;
    margin: 12px 0;
  }
  .timezone {
    color: #666;
    font-size: 13px;
    margin-bottom: 25px;
  }
  button {
    width: 100%;
    padding: 17px;
    margin: 8px 0;
    border: none;
    border-radius: 10px;
    color: white;
    font-size: 20px;
    cursor: pointer;
  }
  .in { background: #18794e; }
  .out { background: #b42318; }
  .camera { background: #2458a6; }
  #status {
    margin-top: 22px;
    line-height: 1.6;
  }
  video {
    width: 100%;
    border-radius: 12px;
    margin-top: 15px;
    display: none;
    transform: scaleX(-1);
  }
</style>
</head>
<body>

<div class="card">
  <h1>Staff Attendance</h1>
  <p>GPS Attendance System</p>

  <div id="date"></div>
  <div id="clock"></div>
  <div class="timezone">UAE Time (GMT+4)</div>

  <button class="camera" onclick="startCamera()">
    Test Front Camera
  </button>

  <video id="video" autoplay playsinline muted></video>

  <button class="in" onclick="checkLocation('IN')">
    Check In
  </button>

  <button class="out" onclick="checkLocation('OUT')">
    Check Out
  </button>

  <div id="status">Ready for testing</div>
</div>

<script>
const statusBox = document.getElementById("status");
const video = document.getElementById("video");
let cameraStream = null;

function updateClock() {
  const now = new Date();

  document.getElementById("date").textContent =
    new Intl.DateTimeFormat("en-GB", {
      timeZone: "Asia/Dubai",
      weekday: "long",
      day: "2-digit",
      month: "long",
      year: "numeric"
    }).format(now);

  document.getElementById("clock").textContent =
    new Intl.DateTimeFormat("en-GB", {
      timeZone: "Asia/Dubai",
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit",
      hour12: true
    }).format(now);
}

updateClock();
setInterval(updateClock, 1000);

async function startCamera() {
  try {
    if (!navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia) {
      statusBox.textContent = "Camera not supported.";
      return;
    }

    if (cameraStream) {
      cameraStream.getTracks().forEach(t => t.stop());
    }

    cameraStream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: "user" }
    });

    video.srcObject = cameraStream;
    video.style.display = "block";
    await video.play();
    statusBox.textContent = "Front camera is working.";
  } catch (error) {
    statusBox.textContent =
      "Camera error: " + error.message;
  }
}

function checkLocation(type) {
  if (!navigator.geolocation) {
    statusBox.textContent = "GPS not supported.";
    return;
  }

  statusBox.textContent = "Checking GPS...";

  navigator.geolocation.getCurrentPosition(
    function(position) {
      statusBox.textContent =
        "GPS detected. " + type +
        " is not yet recorded. Accuracy: " +
        Math.round(position.coords.accuracy) + " meters.";
    },
    function(error) {
      statusBox.textContent =
        "GPS error: " + error.message;
    },
    {
      enableHighAccuracy: true,
      timeout: 15000,
      maximumAge: 0
    }
  );
}
</script>

</body>
</html>
